server {
    listen 80;
    server_name yoyojoy.online www.yoyojoy.online;
    return 301 https://yoyojoy.online$request_uri;
}

server {
    listen 443 ssl;
    server_name www.yoyojoy.online;

    ssl_certificate /etc/letsencrypt/live/yoyojoy.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yoyojoy.online/privkey.pem;

    return 301 https://yoyojoy.online$request_uri;
}

server {
    listen 443 ssl;
    server_name yoyojoy.online;

    ssl_certificate /etc/letsencrypt/live/yoyojoy.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yoyojoy.online/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/yoyojoy-frontend/dist;
    index index.html;

    # Versioned postcard packs live outside the frontend release directory.
    location ^~ /postcards/ {
        alias /var/www/yoyojoy-postcards/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets — aggressive cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker — no cache
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml
               application/manifest+json;
    gzip_min_length 1024;
}
